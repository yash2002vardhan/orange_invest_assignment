[project]
name = "errand-agent"
version = "0.1.0"
description = "Chat agent that books, reschedules and cancels home-service errands against a mocked provider API."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
]

[project.scripts]
errand-chat = "errand_agent.cli:main"
errand-trace = "errand_agent.trace_view:main"
errand-bench = "errand_agent.bench:main"
errand-web = "errand_agent.web:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["errand_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["eval(scenario, expected): scenario row in the generated eval table"]
